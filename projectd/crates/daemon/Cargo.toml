[package]
name = "projectd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "projectd binary: --role control|agent|both."

[[bin]]
name = "projectd"
path = "src/main.rs"

[[bin]]
name = "projectd-cli"
path = "src/cli.rs"
required-features = ["cli"]

[features]
default = []
cli = []

[dependencies]
projectd-protocol = { path = "../protocol" }
projectd-control = { path = "../control" }
projectd-agent = { path = "../agent" }
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
