[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/control",
    "crates/agent",
    "crates/daemon",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
