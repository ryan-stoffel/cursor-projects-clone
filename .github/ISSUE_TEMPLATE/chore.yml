name: Chore
description: Hotfix, docs, CI, or other work that is not a product feature or bug.
title: "[chore] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Use this for hotfix, docs, CI, and repo maintenance. The branch name is still type/ISSUE-short-name (for example chore/78-gitignore or hotfix/56-ci-signing)."
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - chore
        - hotfix
        - docs
        - ci
        - release
        - other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should change.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
    validations:
      required: true
